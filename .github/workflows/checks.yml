name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/diagnose.py --editor-only
      - run: node --check editor/editor.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-browser.txt
      - run: python -m pip install -r tools/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium --no-shell
      - run: python tools/check_track_editor_browser.py --browser managed
